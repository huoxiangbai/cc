<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>P5 原文档生成验收</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  font-size: 12.5pt;
  line-height: 1.5499999999999998;
  color: #333333;
  background: #FFFFFF;
  max-width: 860px;
  margin: 0 auto;
  padding: 48px 32px 96px;
}
h1, h2, h3, h4, h5, h6 { color: #1F4E79; line-height: 1.3; margin: 1.4em 0 0.5em; }
h1 { font-size: 24.0pt; } h2 { font-size: 18.0pt; } h3 { font-size: 14.0pt; }
h3, h4, h5, h6 { color: #333333; }
p { margin: 0 0 0.8em; }
.cols { display: flex; align-items: flex-start; margin: 1em 0; }
.cols .col { min-width: 0; }
a { color: #2E75B6; }
header.cover { text-align: center; padding: 120px 0 80px; page-break-after: always; }
header.cover h1 { font-size: 34.0pt; margin-bottom: 0.3em; }
header.cover .subtitle { font-size: 16.0pt; color: #666666; }
header.cover .meta { margin-top: 64px; color: #666666; }
header.cover-inline { text-align: center; margin-bottom: 2em; }
header.cover-inline .subtitle { color: #666666; }
nav.toc { background: #F5F7FA; border: 1px solid #D9D9D9; border-radius: 8px; padding: 16px 24px; margin: 1.5em 0; }
nav.toc ul { list-style: none; margin: 0; padding: 0; }
nav.toc li { margin: 0.3em 0; }
nav.toc li.toc-l2 { padding-left: 1.2em; }
nav.toc li.toc-l3 { padding-left: 2.4em; font-size: 0.92em; color: #666666; }
nav.toc a { text-decoration: none; }
table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.95em; }
caption { caption-side: bottom; color: #666666; font-size: 0.88em; padding-top: 6px; }
pre { background: #F5F7FA; border: 1px solid #D9D9D9; border-radius: 6px; padding: 14px 16px; overflow-x: auto; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; font-size: 0.9em; }
p code, li code { background: #F5F7FA; border-radius: 3px; padding: 1px 5px; }
blockquote { border-left: 3px solid #1F4E79; margin: 1em 0; padding: 4px 0 4px 16px; color: #666666; }
blockquote footer { text-align: right; font-size: 0.9em; }
.callout { border-left: 4px solid; border-radius: 4px; padding: 12px 16px; margin: 1em 0; }
.callout p { margin: 0; }
.callout .callout-title { font-weight: 700; margin-bottom: 4px; }
.metrics { display: flex; gap: 12px; margin: 1.2em 0; flex-wrap: wrap; }
.metric { flex: 1 1 120px; background: #F5F7FA; border: 1px solid #D9D9D9; border-radius: 8px; padding: 16px 12px; text-align: center; }
.metric .value { font-size: 18.0pt; font-weight: 700; color: #1F4E79; }
.metric .label { color: #666666; font-size: 0.85em; margin-top: 4px; }
.metric .delta { font-size: 0.85em; margin-top: 2px; }
figure { margin: 1.2em 0; text-align: center; }
figure img { max-width: 100%; height: auto; }
figure.math { margin: 1em 0; }
figure.math img.math-display { width: auto; max-width: 100%; }
img.math-inline { width: auto; }
dl { margin: 1em 0; }
dt { font-weight: 700; margin-top: 0.6em; }
dd { margin: 0.2em 0 0.2em 1.4em; }
section.footnotes { margin-top: 2em; font-size: 0.88em; color: #666666; }
section.footnotes hr { width: 30%; margin: 0 0 0.8em; }
section.footnotes ol { padding-left: 1.4em; }
.checklist { margin: 1.2em 0; }
.cl-title { font-size: 1.15em; font-weight: 700; color: #1F4E79; margin-bottom: 0.2em; }
.cl-desc { color: #666666; margin-bottom: 0.6em; }
.cl-progress-label { font-size: 0.85em; font-weight: 700; margin: 0.4em 0 0.2em; }
.cl-progress { background: #F5F7FA; border-radius: 6px; overflow: hidden; height: 14px; margin-bottom: 1em; }
.cl-progress-bar { background: #2F9E5B; height: 14px; color: #fff; font-size: 10px; font-weight: 700; text-align: center; line-height: 14px; min-width: 0; transition: width .3s; }
.cl-group { margin-bottom: 0.8em; }
.cl-group-name { font-weight: 700; margin: 0.6em 0 0.3em; }
.cl-item { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; border-bottom: 1px solid #D9D9D9; }
.cl-glyph { font-weight: 700; flex-shrink: 0; width: 1.2em; text-align: center; }
.cl-body { flex: 1; }
.cl-text { font-size: 0.95em; }
.cl-done .cl-text { color: #666666; }
.cl-prio { display: inline-block; margin-left: 8px; padding: 1px 6px; border-radius: 4px; font-size: 0.68em; font-weight: 700; color: #fff; vertical-align: middle; }
.cl-meta { font-size: 0.78em; color: #666666; margin-top: 2px; }
.cl-notes { font-size: 0.8em; color: #666666; font-style: italic; margin-top: 2px; }
.cl-subs { margin-left: 1em; margin-top: 2px; }
.cl-subs .cl-item { border-bottom: none; }
.cl-legend { margin-top: 0.8em; padding: 8px 12px; background: #F5F7FA; border-radius: 6px; font-size: 0.8em; }
.cl-legend-item { margin-right: 16px; }
figure.align-left { text-align: left; }
figure.align-right { text-align: right; }
figcaption { color: #666666; font-size: 0.88em; margin-top: 6px; }
.task { color: #666666; }
.task.done { color: #2F9E5B; }
hr { border: none; border-top: 1px solid #D9D9D9; margin: 2em 0; }
.page-break { page-break-after: always; }
@media print {
  body { max-width: none; padding: 0; }
  nav.toc a { color: #333333; }
}
</style>
</head>
<body>
<header class="cover-inline"><h1>P5 原文档生成验收</h1></header>

</body>
</html>
