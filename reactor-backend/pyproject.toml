[project]
name = "reactor-backend"
version = "0.1.0"
description = "Independent Reactor Python backend (P5)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.14",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
  "httpx==0.28.1",
  "sqlalchemy==2.0.41",
  "pymysql[rsa]==1.1.1",
  "cryptography==46.0.7",
  "python-multipart==0.0.20",
  "sqlglot==27.4.1",
  "mcp==1.30.0",
  "pyyaml==6.0.2",
  "reportlab==5.0.0",
]
[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]
integration = [
  "aiohttp==3.12.13",
  "loguru==0.7.3",
  "sqlmodel==0.0.24",
  "aiosqlite==0.21.0",
  "python-dotenv==1.1.1",
  "jinja2==3.1.6",
  "sse-starlette==2.4.1",
  "trafilatura==2.0.0",
  "pandas==2.3.0",
  "requests==2.32.3",
  "beautifulsoup4==4.13.4",
  "pyyaml==6.0.2",
  "greenlet==3.2.3",
  "qdrant-client==1.15.1",
  "litellm==1.81.0",
  "smolagents==1.19.0",
  "boto3==1.41.2",
  "pillow==11.3.0",
  "tqdm==4.67.1",
  "nltk==3.9.2",
  "json-repair==0.47.6",
  "langchain-text-splitters==1.0.0",
  "fastembed==0.7.3",
  "elasticsearch==7.17.12",
  "jieba==0.42.1",
  "ddgs==9.10.0",
  "sqlparse==0.5.3",
  "e2b-code-interpreter==2.4.1",
  "matplotlib==3.10.6",
  "openpyxl==3.1.5",
  "scipy==1.16.1",
  "crawl4ai==0.8.6",
  "tabulate==0.9.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "pymupdf==1.27.2.3",
  "pypdf==6.16.2",
  "markdown-it-py==3.0.0",
  "mdit-py-plugins==0.6.1",
  "linkify-it-py==2.1.0",
]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
